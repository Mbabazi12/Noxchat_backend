version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: noxchat
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DBUSER: postgres
      DBPASS: postgres
    ports:
      - 6432:6432
    depends_on:
      - postgres

  redis:
    image: redis:7
    ports:
      - 6379:6379

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/noxchat
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ""
      PORT: 3000
    ports:
      - 3000:3000
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  db-data:
  minio-data:
